[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maintain-ai"
version = "0.1.0"
description = "Background agent that predicts home appliance maintenance and recommends repair vs. replace"
requires-python = ">=3.11"
dependencies = [
    "strands-agents[openai]>=1.55.0",
    "python-dotenv>=1.0.0",
    "chromadb>=1.5.0",
    "psycopg[binary]>=3.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/agents", "src/impl", "src/interfaces", "src/tools"]

[tool.hatch.build.targets.wheel.force-include]
"src/dates.py" = "dates.py"
"src/model.py" = "model.py"
"src/rag.py" = "rag.py"
"src/runtime.py" = "runtime.py"
"src/api.py" = "api.py"
"src/live_trace.py" = "live_trace.py"
"src/confirmations.py" = "confirmations.py"
"src/maintenance_status.py" = "maintenance_status.py"

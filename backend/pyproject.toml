[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maintain-ai"
version = "0.1.0"
description = "Background agent that predicts home appliance maintenance and recommends repair vs. replace"
requires-python = ">=3.11"
dependencies = [
    "strands-agents[openai]>=1.55.0",
    "python-dotenv>=1.0.0",
    "chromadb>=1.5.0",
    "psycopg[binary]>=3.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agents", "src/impl", "src/interfaces", "src/tools"]

[tool.hatch.build.targets.wheel.force-include]
"src/dates.py" = "dates.py"
"src/model.py" = "model.py"
"src/rag.py" = "rag.py"
"src/runtime.py" = "runtime.py"
"src/api.py" = "api.py"
